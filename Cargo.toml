[workspace]
members = [
  "crates/animus-adapter-change-request",
  "crates/animus-adapter-continual",
  "crates/animus-adapter-daemon",
  "crates/animus-adapter-eval",
  "crates/animus-adapter-atif",
  "crates/animus-adapter-observability",
  "crates/animus-adapter-maintenance",
  "crates/animus-adapter-rlm-kernel",
  "crates/animus-adapter-safe",
  "crates/animus-adapter-weave",
  "crates/animus-acp-stdio-host",
  "crates/animus-adapters",
  "crates/animus-core",
  "crates/animus-eval-core",
  "crates/animus-eval-conformance",
  "crates/animus-live-steel-agent",
  "crates/animus-live-terminal",
  "crates/animus-local-daemon",
  "crates/animus-preserves",
  "crates/animus-preserves-adapter",
  "crates/animus-preserves-schema",
  "crates/animus-router",
  "crates/animus-runtime",
  "crates/animus-session-core",
  "crates/animus-std",
  "crates/animus-std-agent-guardrail",
  "crates/animus-std-basalt-authority",
  "crates/animus-std-control",
  "crates/animus-std-check-exec",
  "crates/animus-std-eval",
  "crates/animus-std-lean-loop",
  "crates/animus-std-mcp",
  "crates/animus-std-observability",
  "crates/animus-std-openai",
  "crates/animus-std-rlm-host",
  "crates/animus-std-secretspec",
  "crates/animus-std-workspace-edit",
  "crates/animus-steel",
  "crates/animus-tui",
]
exclude = [
  "vendor/cap-root-core-selected",
  "vendor/durable-file-publication-selected",
]
default-members = [
  ".",
  "crates/animus-adapter-observability",
  "crates/animus-adapter-safe",
  "crates/animus-adapters",
  "crates/animus-core",
  "crates/animus-eval-core",
  "crates/animus-preserves",
  "crates/animus-preserves-adapter",
  "crates/animus-preserves-schema",
  "crates/animus-router",
  "crates/animus-runtime",
  "crates/animus-session-core",
  "crates/animus-std",
  "crates/animus-std-control",
  "crates/animus-std-observability",
  "crates/animus-steel",
  "crates/animus-tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(animus_octet)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.metadata.tigerstyle]
commands = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[workspace.metadata.octet]
cargo_check_args = ["--all-targets"]
default_scope = ["--workspace"]

[package]
name = "animus"
description = "Thin compatibility crate for the animus workspace."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
active-turn-recovery = ["std", "runtime", "animus-std/active-turn-recovery"]
agent-control = ["runtime", "dep:animus-std-control"]
autonomous-gates = ["runtime", "animus-runtime/autonomous-gates"]
persistent-goals = ["runtime", "animus-runtime/persistent-goals"]
schedule-reliability = ["runtime", "animus-runtime/schedule-reliability"]
session-event-replay = ["runtime", "animus-runtime/session-event-replay"]
execution-backend-planner = ["runtime", "std", "animus-runtime/execution-backend-planner", "animus-std/execution-backend-planner"]
agent-role-profiles = ["std", "animus-std/agent-role-profiles"]
acp-stdio-host = ["std", "coding-session-host", "dep:animus-acp-stdio-host"]
branchfs-host = ["std", "animus-std/branchfs-host"]
child-session-host = [
  "std",
  "runtime",
  "coding-session-host",
  "dep:animus-adapter-rlm-kernel",
  "animus-std/child-session-host",
]
coding-session-host = ["std", "runtime", "animus-std/coding-session-host"]
conversation-view-projection = ["std", "runtime", "animus-std/conversation-view-projection"]
session-branch-explorer = ["std", "runtime", "tui", "animus-std/session-branch-explorer"]
codebase-graph-host = ["std", "animus-std/codebase-graph-host"]
codebase-tool-host = ["std", "runtime", "animus-std/codebase-tool-host"]
durable-session-store = ["std", "runtime", "animus-std/durable-session-store"]
durable-steel-kernel-restore = [
  "rlm-kernel",
  "durable-session-store",
  "animus-std/durable-steel-kernel-restore",
]
agent-guardrail = ["dep:animus-std-agent-guardrail"]
real-check-completion-host = ["std", "dep:animus-std-check-exec"]
lean-loop = ["runtime", "dep:animus-std-lean-loop"]
native-evaluation = ["dep:animus-eval-core"]
evaluation-adapters = ["native-evaluation", "dep:animus-adapter-eval", "animus-adapters/evaluation"]
change-request-adapters = ["dep:animus-adapter-change-request", "animus-adapters/change-request"]
maintenance-adapters = ["change-request-adapters", "dep:animus-adapter-maintenance", "animus-adapters/maintenance"]
evaluation-host = ["std", "evaluation-adapters", "dep:animus-std-eval"]
evaluation-conformance = ["evaluation-host", "harbor-eval", "dep:animus-eval-conformance"]
native-evaluation-profile = ["std", "native-evaluation", "animus-std/native-evaluation-profile"]
harbor-eval = ["std", "evaluation-adapters", "harbor-atif", "animus-runtime/harbor-eval", "animus-std/harbor-eval"]
harbor-atif = ["dep:animus-adapter-atif", "animus-adapters/harbor-atif"]
harbor-atif-json = ["harbor-atif", "animus-adapter-atif/json-codec", "animus-adapters/harbor-atif-json"]
mesh-provider = ["std", "animus-std/mesh-provider"]
models-dev-catalog = ["std", "animus-std/models-dev-catalog"]
spacewasm-diagnostic = ["std", "animus-std/spacewasm-diagnostic"]
std = ["dep:animus-std"]
iroh-host = ["std", "animus-std/iroh-host"]
iroh-syndicate-host = ["std", "animus-std/iroh-syndicate-host"]
model-runtime-profiles = ["std", "animus-std/model-runtime-profiles"]
openai-provider-host = ["std", "dep:animus-std-openai", "animus-std-openai/reqwest-client"]
openai-tool-provider-host = ["openai-provider-host", "provider-retry", "animus-std-openai/tool-streaming"]
provider-retry = ["std", "animus-std/provider-retry"]
pijul-vcs-adapter = ["std", "runtime", "animus-runtime/pijul-vcs-adapter", "animus-runtime/provenance", "animus-std/pijul-vcs-adapter"]
trajectory-transcript-adapter = ["std", "runtime", "animus-runtime/trajectory-transcript-adapter", "animus-std/trajectory-transcript-adapter"]
rejected-attempt-context = ["std", "runtime", "animus-std/rejected-attempt-context"]
sandlock-host = ["std", "animus-std/sandlock-host"]
session-tree-export = ["std", "runtime", "animus-std/session-tree-export"]
syndicate-host = ["std", "animus-std/syndicate-host"]
basalt-authority-adapter = ["std", "dep:animus-std-basalt-authority"]
secretspec-host-resolution = ["std", "dep:animus-std-secretspec"]
basalt-reference = ["dep:basalt"]
cairn-reference = ["dep:cairn_core"]
trellis-reference = ["dep:trellis"]
weave-adapter = ["dep:animus-adapter-weave"]
continual-harness = ["dep:animus-adapter-continual"]
daemon-workers = ["dep:animus-adapter-daemon"]
daemon-handoff = ["daemon-workers", "runtime", "std", "animus-std/daemon-handoff"]
workspace-edit-host = ["dep:animus-std-workspace-edit"]
rlm-host-executor = ["rlm-kernel", "dep:animus-std-rlm-host"]
mcp-client-host = ["runtime", "dep:animus-std-mcp"]
messaging-receipts = []
preserves = ["dep:animus-preserves"]
router = ["dep:animus-router"]
runtime = ["std", "dep:animus-runtime"]
rlm-kernel = [
  "runtime",
  "steel",
  "dep:animus-adapter-rlm-kernel",
  "animus-runtime/rlm-kernel",
  "animus-steel/rlm-kernel",
]
steel-skill-modules = ["rlm-kernel", "model-runtime-profiles", "durable-steel-kernel-restore"]
steel = ["dep:animus-steel"]
tui = ["std", "dep:animus-tui"]
terminal-image = ["tui", "animus-tui/terminal-image"]
terminal-video = ["terminal-image", "animus-tui/terminal-video"]

