[workspace]
members = [
  "crates/animus-adapters",
  "crates/animus-core",
  "crates/animus-preserves",
  "crates/animus-router",
  "crates/animus-runtime",
  "crates/animus-std",
  "crates/animus-steel",
  "crates/animus-tui",
]
default-members = [
  ".",
  "crates/animus-adapters",
  "crates/animus-core",
  "crates/animus-preserves",
  "crates/animus-router",
  "crates/animus-runtime",
  "crates/animus-std",
  "crates/animus-steel",
  "crates/animus-tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(animus_octet)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.metadata.tigerstyle]
commands = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[workspace.metadata.octet]
cargo_check_args = ["--all-targets"]
default_scope = ["--workspace"]

[package]
name = "animus"
description = "Thin compatibility crate for the animus workspace."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["dep:animus-std"]
basalt-reference = ["dep:basalt"]
cairn-reference = ["dep:cairn_core"]
trellis-reference = ["dep:trellis"]
preserves = ["dep:animus-preserves"]
router = ["dep:animus-router"]
runtime = ["std", "dep:animus-runtime"]
steel = ["dep:animus-steel"]
tui = ["std", "dep:animus-tui"]

[dependencies]
animus-adapters = { path = "crates/animus-adapters", version = "0.1.0" }
animus-core = { path = "crates/animus-core", version = "0.1.0" }
animus-preserves = { path = "crates/animus-preserves", version = "0.1.0", optional = true }
animus-router = { path = "crates/animus-router", version = "0.1.0", optional = true }
animus-runtime = { path = "crates/animus-runtime", version = "0.1.0", optional = true }
animus-std = { path = "crates/animus-std", version = "0.1.0", optional = true }
animus-steel = { path = "crates/animus-steel", version = "0.1.0", optional = true }
animus-tui = { path = "crates/animus-tui", version = "0.1.0", optional = true }
basalt = { git = "ssh://git@github.com/OnixResearch/basalt.git", rev = "005e1496a4a1be477ba84008ecbcdf8793a236c6", optional = true }
cairn_core = { package = "cairn-core", git = "ssh://git@github.com/OnixResearch/cairn.git", rev = "24381f77987b7e519ebbf05a62b959290d89c582", optional = true }
trellis = { package = "verified-logic", git = "ssh://git@github.com/OnixResearch/trellis.git", rev = "68ac5824f0ef664e4bedeb8ea92ee938b9e00da0", optional = true }
