[package]
name = "animus-acp-stdio-host"
description = "Optional bounded ACP stdio host for Animus coding sessions."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
nominal-compile-fixtures = []

[dependencies]
agent-client-protocol = { version = "=0.10.4", default-features = false }
agent-client-protocol-schema = { version = "=0.11.4", default-features = false }
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-runtime = { path = "../animus-runtime", version = "0.1.0", default-features = false }
animus-std = { path = "../animus-std", version = "0.1.0", default-features = false, features = ["coding-session-host"] }
blake3 = { version = "1.8.5", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
animus-tui = { path = "../animus-tui", version = "0.1.0" }
