[package]
name = "animus-std-openai"
description = "Authority-scoped live OpenAI-compatible Responses host for Animus."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
reqwest-client = ["dep:reqwest"]
tool-streaming = ["dep:animus-runtime", "animus-std/provider-retry", "reqwest-client"]

[dependencies]
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-runtime = { path = "../animus-runtime", version = "0.1.0", default-features = false, optional = true }
animus-std = { path = "../animus-std", version = "0.1.0", default-features = false }
blake3 = "1.8.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zeroize = "1.8"

[dev-dependencies]
rcgen = "0.13.2"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

[[bin]]
name = "animus-live-openai-smoke"
path = "src/bin/animus-live-openai-smoke.rs"
required-features = ["reqwest-client"]

[[bin]]
name = "animus-live-openrouter-smoke"
path = "src/bin/animus-live-openrouter-smoke.rs"
required-features = ["reqwest-client"]

[[bin]]
name = "animus-live-local-dspark-smoke"
path = "src/bin/animus-live-local-dspark-smoke.rs"
required-features = ["reqwest-client"]

[[test]]
name = "live-openai"
path = "tests/live-openai.rs"
required-features = ["reqwest-client"]
