[package]
name = "animus-tui"
description = "Optional terminal UI host shell for animus."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
rats-widgets = ["dep:rats", "dep:rat-keymap"]
terminal-image = ["dep:blake3", "dep:rat-image"]

[dependencies]
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-runtime = { path = "../animus-runtime", version = "0.1.0" }
animus-std = { path = "../animus-std", version = "0.1.0" }
blake3 = { version = "1.8.2", optional = true }
rat-image = { package = "rat-image", git = "ssh://git@github.com/brittonr/rats.git", rev = "3b498c3d7c248c335d3e7faf12f133a18c87d632", optional = true }
rat-keymap = { package = "rat-keymap", git = "ssh://git@github.com/brittonr/rats.git", rev = "3b498c3d7c248c335d3e7faf12f133a18c87d632", optional = true }
rats = { package = "rat-widgets", git = "ssh://git@github.com/brittonr/rats.git", rev = "3b498c3d7c248c335d3e7faf12f133a18c87d632", default-features = false, optional = true }
