[package]
name = "animus-local-daemon"
description = "Non-default local supervisor and worker process host for Animus."
edition.workspace = true
license = "AGPL-3.0-or-later"
readme = "README.md"
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
live-worker = ["animus-live-steel-agent/live-provider"]

[dependencies]
animus-adapter-daemon = { path = "../animus-adapter-daemon", version = "0.1.0" }
animus-live-steel-agent = { path = "../animus-live-steel-agent", version = "0.1.0" }
blake3 = "1.8.5"
cap-std = "3.4.5"
nix = { version = "0.30.1", features = ["process", "signal", "socket"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"
