[package]
name = "animus-live-steel-agent"
description = "Non-default headless composition root for the live Animus Steel agent."
edition.workspace = true
license = "AGPL-3.0-or-later"
readme = "README.md"
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
live-provider = ["animus-std-openai/reqwest-client"]

[dependencies]
animus-adapter-rlm-kernel = { path = "../animus-adapter-rlm-kernel", version = "0.1.0" }
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-runtime = { path = "../animus-runtime", version = "0.1.0", default-features = false, features = ["rlm-kernel"] }
animus-std = { path = "../animus-std", version = "0.1.0", default-features = false, features = ["coding-session-host", "durable-session-store", "durable-steel-kernel-restore", "child-session-host", "provider-retry"] }
animus-std-openai = { path = "../animus-std-openai", version = "0.1.0", default-features = false, features = ["tool-streaming"] }
animus-std-rlm-host = { path = "../animus-std-rlm-host", version = "0.1.0" }
animus-steel = { path = "../animus-steel", version = "0.1.0", features = ["rlm-kernel"] }
blake3 = "1.8.5"
cap-std = "3.4.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "animus-live-steel-agent"
path = "src/main.rs"
required-features = ["live-provider"]

[[test]]
name = "application"
required-features = ["live-provider"]
