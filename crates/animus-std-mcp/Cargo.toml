[package]
name = "animus-std-mcp"
description = "Non-default bounded MCP standard-input client host for Animus."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-runtime = { path = "../animus-runtime", version = "0.1.0" }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["process", "signal"] }

[dev-dependencies]
tempfile = "3"
