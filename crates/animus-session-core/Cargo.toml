[package]
name = "animus-session-core"
description = "Pure no-std session state and evidence contracts for animus."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
session-event-replay = []

[dependencies]
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
blake3 = { version = "1.8.5", default-features = false }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"
