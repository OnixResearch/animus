[package]
name = "animus-frozen-policy"
description = "Pure no-std admission, evaluation, and receipts for frozen local selection policies."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.5", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1.0.149"
