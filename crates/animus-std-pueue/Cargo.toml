[package]
name = "animus-std-pueue"
description = "Non-default capability-scoped pueue host for Animus."
edition.workspace = true
license = "AGPL-3.0-or-later"
readme.workspace = true
rust-version.workspace = true
version.workspace = true
autobins = false

[lints]
workspace = true

[dependencies]
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-runtime = { path = "../animus-runtime", version = "0.1.0" }
blake3 = "1.8.5"
bounded-exec = { git = "ssh://git@github.com/OnixResearch/bounded-exec.git", rev = "29dac88ecded94457572db3fdfaaaab95fa91525" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"
