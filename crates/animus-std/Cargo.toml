[package]
name = "animus-std"
description = "std runtime shell for animus."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[[test]]
name = "outcome_machine_lifecycle"
path = "tests/outcome/machine/lifecycle.rs"

[lints]
workspace = true

[features]
default = ["observability-host"]
active-turn-recovery = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
agent-role-profiles = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
authoritative-completion = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
authoritative-completion-smoke = ["authoritative-completion", "multi-role-smoke"]
branchfs-host = []
child-session-host = ["coding-session-host", "dep:animus-adapter-rlm-kernel"]
coding-session-host = ["durable-session-store", "runtime-authority-seal", "tool-execution-stages"]
conversation-view-projection = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
execution-backend-planner = ["dep:animus-runtime", "animus-runtime/execution-backend-planner"]
session-branch-explorer = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
codebase-graph-host = ["dep:serde", "dep:serde_json", "dep:tree-sitter", "dep:tree-sitter-rust"]
codebase-tool-host = ["codebase-graph-host", "dep:animus-runtime"]
daemon-handoff = ["pending-input-vault"]
dogfood-smoke = ["dep:animus-runtime"]
durable-session-store = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
durable-steel-kernel-restore = [
  "durable-session-store",
  "dep:animus-adapter-rlm-kernel",
  "dep:animus-steel",
  "animus-runtime/rlm-kernel",
  "animus-steel/rlm-kernel",
]
harbor-eval = ["dep:animus-runtime", "animus-runtime/harbor-eval", "animus-adapters/evaluation", "dep:serde_json"]
harness-convergence = ["dep:animus-runtime"]
native-evaluation-profile = ["dep:animus-eval-core", "dep:serde", "dep:serde_json"]
mesh-provider = ["dep:serde", "dep:serde_json"]
model-catalog = ["dep:serde", "dep:serde_json"]
models-dev-catalog = ["dep:serde", "dep:serde_json"]
model-runtime-profiles = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
pending-input-vault = ["coding-session-host", "active-turn-recovery"]
multi-role-smoke = ["agent-role-profiles", "model-runtime-profiles"]
provider-retry = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
profile-retry-smoke = ["model-runtime-profiles", "provider-retry"]
pijul-vcs-adapter = ["dep:animus-runtime", "animus-runtime/pijul-vcs-adapter", "animus-runtime/provenance", "dep:serde", "dep:serde_json"]
trajectory-transcript-adapter = ["dep:animus-runtime", "animus-runtime/trajectory-transcript-adapter", "dep:serde", "dep:serde_json"]
tool-execution-stages = ["dep:animus-runtime"]
rejected-attempt-context = ["dep:animus-runtime"]
runtime-authority-seal = ["dep:animus-runtime"]
sandlock-host = ["dep:sandlock-core", "dep:tokio"]
session-tree-export = ["dep:animus-runtime", "dep:serde", "dep:serde_json"]
spacewasm-diagnostic = ["dep:serde_json"]
observability-host = ["dep:animus-std-observability"]
iroh-host = []
iroh-syndicate-host = ["iroh-host", "syndicate-host"]
syndicate-host = ["dep:animus-preserves"]

[[bin]]
name = "animus-dogfood-smoke"
path = "src/bin/animus-dogfood-smoke.rs"
required-features = ["dogfood-smoke"]

[[bin]]
name = "animus-daemon-handoff-smoke"
path = "src/bin/animus-daemon-handoff-smoke.rs"
required-features = ["daemon-handoff"]

[[bin]]
name = "animus-coding-session-smoke"
path = "src/bin/animus-coding-session-smoke.rs"
required-features = ["coding-session-host"]

[[bin]]
name = "animus-codebase-tool-smoke"
path = "src/bin/animus-codebase-tool-smoke.rs"
required-features = ["codebase-tool-host"]

[[bin]]
name = "animus-profile-retry-smoke"
path = "src/bin/animus-profile-retry-smoke.rs"
required-features = ["profile-retry-smoke"]

[[bin]]
name = "animus-authoritative-completion-smoke"
path = "src/bin/animus-authoritative-completion-smoke.rs"
required-features = ["authoritative-completion-smoke"]

[[bin]]
name = "animus-multi-role-smoke"
path = "src/bin/animus-multi-role-smoke.rs"
required-features = ["multi-role-smoke"]

[[bin]]
name = "animus-sandlock-live-fixture"
path = "src/bin/animus-sandlock-live-fixture.rs"
required-features = ["sandlock-host"]

[[test]]
name = "coding-session-restart"
path = "tests/coding-session-restart.rs"
required-features = ["coding-session-host"]

[[test]]
name = "durable-session-restart"
path = "tests/durable-session-restart.rs"
required-features = ["durable-session-store"]

[dependencies]
animus-adapter-rlm-kernel = { path = "../animus-adapter-rlm-kernel", version = "0.1.0", optional = true }
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-core = { path = "../animus-core", version = "0.1.0" }
animus-eval-core = { path = "../animus-eval-core", version = "0.1.0", optional = true }
animus-preserves = { path = "../animus-preserves", version = "0.1.0", optional = true }
animus-runtime = { path = "../animus-runtime", version = "0.1.0", default-features = false, optional = true }
animus-steel = { path = "../animus-steel", version = "0.1.0", optional = true }
animus-std-observability = { path = "../animus-std-observability", version = "0.1.0", optional = true }
blake3 = { version = "1.8.5", default-features = false }
cap-std = "3.4"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
tree-sitter = { version = "0.25.10", optional = true }
tree-sitter-rust = { version = "0.24.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
sandlock-core = { git = "https://github.com/multikernel/sandlock.git", rev = "e8c4cc0ef58e3fc145c4d147a61b889b4f291a10", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }
