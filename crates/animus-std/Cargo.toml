[package]
name = "animus-std"
description = "std runtime shell for animus."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
dogfood-smoke = ["dep:animus-runtime"]
iroh-host = []
syndicate-host = []

[[bin]]
name = "animus-dogfood-smoke"
path = "src/bin/animus-dogfood-smoke.rs"
required-features = ["dogfood-smoke"]

[dependencies]
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-core = { path = "../animus-core", version = "0.1.0" }
animus-runtime = { path = "../animus-runtime", version = "0.1.0", default-features = false, optional = true }
blake3 = { version = "1.8.5", default-features = false }
cap-std = "3.4"
redb = "2.6.3"
