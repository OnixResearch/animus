[package]
name = "animus-campaign-manager"
description = "Optional AI campaign manager role that steers a Campaign exploration campaign through Campaign's advisory seam."
edition.workspace = true
license = "AGPL-3.0-or-later"
readme.workspace = true
rust-version = "1.96"
version.workspace = true

[lints]
workspace = true

[dependencies]
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
campaign-choregraph = { version = "0.1.0", git = "https://seed.radicle.garden/z2scC9MCm3pxk9mX4FEidRKabQ5LN.git", rev = "796fe3844c91c3060da5ffc573a6f801a214aba7", default-features = false }
campaign-core = { version = "0.1.0", git = "https://seed.radicle.garden/z2scC9MCm3pxk9mX4FEidRKabQ5LN.git", rev = "796fe3844c91c3060da5ffc573a6f801a214aba7", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
