[package]
name = "animus-adapters"
description = "no_std adapter contracts for swappable animus components."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
evaluation = ["dep:animus-adapter-eval"]
harbor-atif = ["dep:animus-adapter-atif"]
harbor-atif-json = ["harbor-atif", "animus-adapter-atif/json-codec"]

[dependencies]
animus-adapter-continual = { path = "../animus-adapter-continual", version = "0.1.0" }
animus-adapter-daemon = { path = "../animus-adapter-daemon", version = "0.1.0" }
animus-adapter-eval = { path = "../animus-adapter-eval", version = "0.1.0", optional = true }
animus-adapter-atif = { path = "../animus-adapter-atif", version = "0.1.0", optional = true }
animus-adapter-observability = { path = "../animus-adapter-observability", version = "0.1.0" }
animus-adapter-rlm-kernel = { path = "../animus-adapter-rlm-kernel", version = "0.1.0" }
animus-adapter-safe = { path = "../animus-adapter-safe", version = "0.1.0" }
animus-core = { path = "../animus-core", version = "0.1.0" }
animus-router = { path = "../animus-router", version = "0.1.0" }
blake3 = { version = "1.8.5", default-features = false }
host-control-core = { git = "ssh://git@github.com/OnixResearch/host-control.git", rev = "e359ccb80a52efb860307278510fa5297ac970ed" }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
