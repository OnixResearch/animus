[package]
name = "animus-adapter-atif"
description = "Pure no_std ATIF-v1.7 interchange contracts for Animus."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
json-codec = ["dep:serde", "dep:serde_json"]

[dependencies]
blake3 = { version = "1.8.5", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1.0.150", default-features = false, features = ["alloc"], optional = true }
