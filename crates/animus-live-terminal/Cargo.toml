[package]
name = "animus-live-terminal"
description = "Non-default live terminal client for Animus."
edition.workspace = true
license = "AGPL-3.0-or-later"
readme = "README.md"
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
live-terminal = [
  "dep:crossterm",
  "dep:ratatui",
  "dep:signal-hook",
  "animus-tui/packaged-tui-dogfood-smoke",
]

[[bin]]
name = "animus-live-terminal"
path = "src/main.rs"
required-features = ["live-terminal"]

[dependencies]
animus-adapter-daemon = { path = "../animus-adapter-daemon", version = "0.1.0" }
animus-local-daemon = { path = "../animus-local-daemon", version = "0.1.0" }
animus-runtime = { path = "../animus-runtime", version = "0.1.0", features = ["rlm-kernel"] }
animus-tui = { path = "../animus-tui", version = "0.1.0" }
blake3 = "1.8.5"
crossterm = { version = "0.29.0", default-features = false, features = ["events"], optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = { version = "0.3.18", optional = true }

[dev-dependencies]
nix = { version = "0.30.1", features = ["term"] }
tempfile = "3.27.0"
