[package]
name = "animus-runtime"
description = "Reusable Steel-backed agent loop runtime for animus."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["compat", "steel"]
all-families = [
  "batch",
  "compaction",
  "dataset-export",
  "headless",
  "loop",
  "policy",
  "provenance",
  "quality",
  "research",
  "scaffold",
  "status",
  "worker-team",
]
compat = ["all-families", "steel"]
batch = []
compaction = []
dataset-export = []
headless = []
loop = []
policy = []
provenance = []
quality = []
research = []
scaffold = []
status = []
worker-team = []
steel = ["dep:animus-steel"]

[dependencies]
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-core = { path = "../animus-core", version = "0.1.0" }
animus-steel = { path = "../animus-steel", version = "0.1.0", optional = true }
blake3 = { version = "1.8.5", default-features = false }
