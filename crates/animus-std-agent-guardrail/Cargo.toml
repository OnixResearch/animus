[package]
name = "animus-std-agent-guardrail"
description = "Optional Linux Bubblewrap guardrail shell for Animus agent processes."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.5"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
