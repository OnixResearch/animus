[package]
name = "animus-acp-coding-agent"
description = "Optional ACP coding agent for Animus: workspace-confined edits and declared checks, served over ACP stdio."
edition.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.5", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
animus-std-openai = { path = "../animus-std-openai", version = "0.1.0", features = ["tool-streaming"] }
